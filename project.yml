name: RemnantVOP

options:
  bundleIdPrefix: com.neyjealous
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

packages:
  WireGuardKit:
    url: https://github.com/amnezia-vpn/amneziawg-apple.git
    revision: 9d5ee60edefa95b933a738dd7cda671dd18021fc

targets:
  RemnantVOP:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
        excludes:
          - AWG/**
          - Engine/**
          - SingBox/SingBoxRuntime.swift
          - SingBox/SingBoxPlatformInterface.swift
          - SingBox/SingBoxCommandHandler.swift
          - Xray/**
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Remnant VPN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "Камера используется только для сканирования QR-кодов VPN-конфигураций."
        NSFaceIDUsageDescription: "Face ID используется для защиты доступа к VPN-конфигурациям."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOP
        CODE_SIGN_ENTITLEMENTS: App/RemnantVOP.entitlements
    dependencies:
      - target: RemnantVOPAWGTunnel
      - target: RemnantVOPHysteriaTunnel
      - target: RemnantVOPXrayTunnel

  RemnantVOPAWGTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/AWG
      - path: Core/AWG
      - path: Core/Models
      - path: Core/Routing
      - path: Core/Tunnel
    info:
      path: Extensions/AWG/Info.plist
      properties:
        CFBundleDisplayName: Remnant VPN AWG
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOP.AWGTunnel
        CODE_SIGN_ENTITLEMENTS: Extensions/AWG/AWGTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit

  RemnantVOPHysteriaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Hysteria
      - path: Core/Engine/VPNEngine.swift
      - path: Core/Engine/SingBoxEngine.swift
      - path: Core/SingBox
      - path: Core/Models
      - path: Core/Routing
      - path: Core/Tunnel
    info:
      path: Extensions/Hysteria/Info.plist
      properties:
        CFBundleDisplayName: Remnant VPN Hysteria2
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOP.HysteriaTunnel
        CODE_SIGN_ENTITLEMENTS: Extensions/Hysteria/HysteriaTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - framework: Vendor/Libbox.xcframework
        embed: false

  RemnantVOPXrayTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Xray
      - path: Core/Xray
      - path: Core/Models
      - path: Core/Routing
      - path: Core/Tunnel
    info:
      path: Extensions/Xray/Info.plist
      properties:
        CFBundleDisplayName: Remnant VPN Xray
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOP.XrayTunnel
        CODE_SIGN_ENTITLEMENTS: Extensions/Xray/XrayTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - framework: Vendor/LibXray.xcframework
        embed: false

  RemnantVOPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RemnantVOP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOPTests
