name: RemnantVOP

options:
  bundleIdPrefix: com.neyjealous
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

packages:
  WireGuardKit:
    url: https://github.com/amnezia-vpn/amneziawg-apple.git
    revision: 9d5ee60edefa95b933a738dd7cda671dd18021fc

targets:
  RemnantVOP:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
        excludes:
          - Engine/**
          - AWG/AWGQuickConfigParser.swift
          - SingBox/SingBoxRuntime.swift
          - SingBox/SingBoxPlatformInterface.swift
          - SingBox/SingBoxCommandHandler.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RemnantVOP
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOP
        CODE_SIGN_ENTITLEMENTS: App/RemnantVOP.entitlements
    dependencies:
      - target: RemnantVOPAWGTunnel
      - target: RemnantVOPHysteriaTunnel

  RemnantVOPAWGTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/AWG
      - path: Core
        excludes:
          - Engine/**
          - SingBox/**
    info:
      path: Extensions/AWG/Info.plist
      properties:
        CFBundleDisplayName: RemnantVOP AWG
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOP.AWGTunnel
        CODE_SIGN_ENTITLEMENTS: Extensions/AWG/AWGTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit

  RemnantVOPHysteriaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Hysteria
      - path: Core
        excludes:
          - AWG/AWGQuickConfigParser.swift
          - Engine/AWGEngine.swift
          - Engine/EngineFactory.swift
    info:
      path: Extensions/Hysteria/Info.plist
      properties:
        CFBundleDisplayName: RemnantVOP Hysteria2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOP.HysteriaTunnel
        CODE_SIGN_ENTITLEMENTS: Extensions/Hysteria/HysteriaTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - framework: Vendor/Libbox.xcframework
        embed: false

  RemnantVOPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RemnantVOP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neyjealous.RemnantVOPTests
