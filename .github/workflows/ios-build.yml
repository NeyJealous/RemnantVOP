name: iOS Build

on:
  push:
    branches:
      - main
      - phase-0-foundation
      - phase-1-awg
      - phase-2-singbox
  pull_request:

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Cache sing-box Libbox
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: Vendor/Libbox.xcframework
          key: libbox-ios-v1.14.1-1ac1a339-go1.26-${{ runner.os }}

      - name: Build sing-box Libbox
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: ./scripts/build-singbox-libbox.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RemnantVOP.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/.spm"

      - name: Build AmneziaWG Go bridge
        run: ./scripts/build-awg-bridge.sh "$PWD/.spm/checkouts/amneziawg-apple"

      - name: Build without signing
        run: |
          xcodebuild \
            -project RemnantVOP.xcodeproj \
            -scheme RemnantVOP \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$PWD/.spm" \
            CODE_SIGNING_ALLOWED=NO \
            build
