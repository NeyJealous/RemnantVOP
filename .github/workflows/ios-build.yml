name: iOS Build

on:
  push:
    branches:
      - main
      - phase-0-foundation
      - phase-1-awg
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RemnantVOP.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/.spm"

      - name: Build AmneziaWG Go bridge
        run: |
          AWG_CHECKOUT="$PWD/.spm/checkouts/amneziawg-apple"
          test -d "$AWG_CHECKOUT/Sources/WireGuardKitGo"

          make -C "$AWG_CHECKOUT/Sources/WireGuardKitGo" \
            ARCHS=arm64 \
            PLATFORM_NAME=iphoneos \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            DEPLOYMENT_TARGET_CLANG_FLAG_NAME=miphoneos-version-min \
            DEPLOYMENT_TARGET_CLANG_ENV_NAME=IPHONEOS_DEPLOYMENT_TARGET

      - name: Build without signing
        run: |
          xcodebuild \
            -project RemnantVOP.xcodeproj \
            -scheme RemnantVOP \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$PWD/.spm" \
            CODE_SIGNING_ALLOWED=NO \
            build
