name: iOS Release Candidate

on:
  push:
    branches:
      - main
      - release-v1-rc1
      - release-v1-rc2
      - clashmi-migration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Restore Mihomo core cache
        id: restore-mihomo
        uses: actions/cache/restore@v4
        with:
          path: Vendor/Libmihomo.xcframework
          key: mihomo-ios-${{ hashFiles('scripts/build-mihomo-lib.sh') }}-go1.26-${{ runner.os }}

      - name: Build Mihomo iOS core
        if: steps.restore-mihomo.outputs.cache-hit != 'true'
        run: ./scripts/build-mihomo-lib.sh

      - name: Save Mihomo core cache
        if: steps.restore-mihomo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/Libmihomo.xcframework
          key: mihomo-ios-${{ hashFiles('scripts/build-mihomo-lib.sh') }}-go1.26-${{ runner.os }}

      - name: Restore libXray cache
        id: restore-libxray
        uses: actions/cache/restore@v4
        with:
          path: Vendor/LibXray.xcframework
          key: libxray-ios-v26.9.9-cgo-${{ runner.os }}

      - name: Fetch libXray
        if: steps.restore-libxray.outputs.cache-hit != 'true'
        run: ./scripts/fetch-libxray.sh

      - name: Save libXray cache
        if: steps.restore-libxray.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/LibXray.xcframework
          key: libxray-ios-v26.9.9-cgo-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RemnantVOP.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/.spm"

      - name: Build AmneziaWG Go bridge
        run: ./scripts/build-awg-bridge.sh "$PWD/.spm/checkouts/amneziawg-apple"

      - name: Build Release without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project RemnantVOP.xcodeproj \
            -scheme RemnantVOP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.spm" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/RemnantVOP.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          /usr/bin/zip -qry RemnantVOP-mihomo-migration-unsigned.ipa Payload
          shasum -a 256 RemnantVOP-mihomo-migration-unsigned.ipa > SHA256SUMS.txt
          cd ..

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: RemnantVOP-mihomo-migration-unsigned
          path: |
            build/RemnantVOP-mihomo-migration-unsigned.ipa
            build/SHA256SUMS.txt
            docs/SIGNING.md
          if-no-files-found: error

  publish_release:
    name: Publish downloadable unsigned IPA
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: RemnantVOP-mihomo-migration-unsigned
          path: downloaded

      - name: Verify checksums, IPA and all VPN extensions
        run: |
          set -euo pipefail
          mkdir -p release
          cp downloaded/build/RemnantVOP-mihomo-migration-unsigned.ipa release/
          cp downloaded/build/SHA256SUMS.txt release/
          cp downloaded/docs/SIGNING.md release/
          cd release
          sha256sum -c SHA256SUMS.txt
          unzip -tq RemnantVOP-mihomo-migration-unsigned.ipa > /dev/null
          EXTENSION_COUNT="$(unzip -Z1 RemnantVOP-mihomo-migration-unsigned.ipa | grep -E '^Payload/RemnantVOP.app/PlugIns/[^/]+\.appex/' | cut -d/ -f4 | sort -u | wc -l)"
          test "$EXTENSION_COUNT" -eq 3

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="remnant-${GITHUB_REF_NAME}-build-${GITHUB_RUN_NUMBER}"
          cat > release/RELEASE_NOTES.md <<'EOF'
          ## Remnant VPN — iOS unsigned test build

          This prerelease is automatically published **only after a successful iOS Release build** and verification of the IPA, SHA-256 checksum and three Packet Tunnel extensions.

          **Downloads:** unsigned IPA, SHA256SUMS.txt and SIGNING.md.

          Sign the main app and all three embedded VPN extensions with your own Apple certificate and compatible provisioning profiles. This build has not been validated for network connectivity on a physical iPhone; a successful CI build alone does not confirm that each protocol works.
          EOF
          gh release create "$TAG" \
            release/RemnantVOP-mihomo-migration-unsigned.ipa \
            release/SHA256SUMS.txt \
            release/SIGNING.md \
            --target "$GITHUB_SHA" \
            --title "Remnant VPN — ${GITHUB_REF_NAME} — Build ${GITHUB_RUN_NUMBER}" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
          RELEASE_URL="$(gh release view "$TAG" --json url --jq '.url')"
          {
            echo "### Downloadable unsigned IPA published"
            echo "[Open GitHub Release](${RELEASE_URL})"
            echo "Tag: \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
