name: iOS Release Candidate

on:
  push:
    branches:
      - main
      - release-v1-rc1
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Cache sing-box Libbox
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: Vendor/Libbox.xcframework
          key: libbox-ios-v1.14.1-1ac1a339-go1.26-${{ runner.os }}

      - name: Build sing-box Libbox
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: ./scripts/build-singbox-libbox.sh

      - name: Cache libXray
        id: cache-libxray
        uses: actions/cache@v4
        with:
          path: Vendor/LibXray.xcframework
          key: libxray-ios-v26.9.9-cgo-${{ runner.os }}

      - name: Fetch libXray
        if: steps.cache-libxray.outputs.cache-hit != 'true'
        run: ./scripts/fetch-libxray.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RemnantVOP.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/.spm"

      - name: Build AmneziaWG Go bridge
        run: ./scripts/build-awg-bridge.sh "$PWD/.spm/checkouts/amneziawg-apple"

      - name: Build Release without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project RemnantVOP.xcodeproj \
            -scheme RemnantVOP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.spm" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/RemnantVOP.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          /usr/bin/zip -qry RemnantVOP-1.0.0-rc1-unsigned.ipa Payload
          cd ..
          shasum -a 256 build/RemnantVOP-1.0.0-rc1-unsigned.ipa > build/SHA256SUMS.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: RemnantVOP-1.0.0-rc1-unsigned
          path: |
            build/RemnantVOP-1.0.0-rc1-unsigned.ipa
            build/SHA256SUMS.txt
            docs/SIGNING.md
          if-no-files-found: error
