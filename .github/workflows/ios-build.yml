name: iOS Build

on:
  push:
    branches:
      - main
      - phase-0-foundation
      - phase-1-awg
      - phase-2-singbox
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build sing-box Libbox
        run: ./scripts/build-singbox-libbox.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RemnantVOP.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/.spm"

      - name: Build AmneziaWG Go bridge
        run: ./scripts/build-awg-bridge.sh "$PWD/.spm/checkouts/amneziawg-apple"

      - name: Build without signing
        run: |
          xcodebuild \
            -project RemnantVOP.xcodeproj \
            -scheme RemnantVOP \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$PWD/.spm" \
            CODE_SIGNING_ALLOWED=NO \
            build
