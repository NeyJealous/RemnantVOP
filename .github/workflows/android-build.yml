name: Remnant VPN Android Technical Preview

on:
  push:
    branches:
      - android-mvp
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android arm64 pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Remnant overlay
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Setup Flutter (upstream pinned SDK)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.1'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Checkout pinned FlClash and apply Remnant overlay
        run: ./scripts/bootstrap-android-flclash.sh

      - name: Resolve Flutter dependencies
        working-directory: .deps/FlClash
        run: flutter pub get

      - name: Build native Mihomo and Android arm64 APK
        working-directory: .deps/FlClash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env dev --arch arm64 -v

      - name: Package Android preview and corresponding sources
        run: |
          set -euo pipefail
          mkdir -p build
          mapfile -t apks < <(find .deps/FlClash/dist -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one arm64 APK; found %s:\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" build/RemnantVPN-Android-TechnicalPreview-arm64.apk
          unzip -tq build/RemnantVPN-Android-TechnicalPreview-arm64.apk > /dev/null
          unzip -Z1 build/RemnantVPN-Android-TechnicalPreview-arm64.apk > build/APK-CONTENTS.txt
          grep -Fxq 'lib/arm64-v8a/libclash.so' build/APK-CONTENTS.txt

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose build/RemnantVPN-Android-TechnicalPreview-arm64.apk

          (
            cd .deps/FlClash
            tar -czf "$GITHUB_WORKSPACE/build/RemnantVPN-Android-CorrespondingSource.tar.gz" \
              --exclude=.git --exclude=.dart_tool --exclude=.gradle \
              --exclude=build --exclude=libclash --exclude=dist .
          )
          cp scripts/bootstrap-android-flclash.sh scripts/patch-android-flclash.py build/
          (
            cd build
            sha256sum RemnantVPN-Android-TechnicalPreview-arm64.apk > SHA256SUMS.txt
          )

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: RemnantVPN-Android-TechnicalPreview-arm64
          path: |
            build/RemnantVPN-Android-TechnicalPreview-arm64.apk
            build/RemnantVPN-Android-CorrespondingSource.tar.gz
            build/bootstrap-android-flclash.sh
            build/patch-android-flclash.py
            build/SHA256SUMS.txt
            build/APK-CONTENTS.txt
          if-no-files-found: error

  release:
    name: Publish Android APK to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK and sources
        uses: actions/download-artifact@v4
        with:
          name: RemnantVPN-Android-TechnicalPreview-arm64
          path: release

      - name: Verify release checksum
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt

      - name: Create technical prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="remnant-android-mvp-build-${GITHUB_RUN_NUMBER}"
          cat > release/NOTES.md <<'NOTES'
          ## Remnant VPN — Android Technical Preview (arm64)

          This is an early **networking baseline** derived from the GPL-3.0
          FlClash/Mihomo Android app pinned to the commit documented in the
          build scripts. It retains the upstream Flutter UI in this first
          preview; the Android launcher is labelled Remnant VPN (Android).
          Firebase analytics and Crashlytics are disabled by the overlay.

          Hysteria2 must be validated with a known-good profile on an Android
          device: connect, traffic, disconnect and repeated connection.
          VLESS and AWG 3.1 integration have not been qualified as Remnant
          features yet.

          The APK is debug-key signed for testing only, with package ID
          com.neyjealous.remnantvpn.android.dev. A later run can have a
          different debug signing key: uninstall before reinstalling if Android
          reports a signature mismatch. Never install untrusted APKs.

          Corresponding source is attached along with the bootstrap and overlay
          scripts. FlClash copyright and GPL-3.0 notices are retained.
          NOTES
          gh release create "$tag" \
            release/RemnantVPN-Android-TechnicalPreview-arm64.apk \
            release/SHA256SUMS.txt \
            release/RemnantVPN-Android-CorrespondingSource.tar.gz \
            release/bootstrap-android-flclash.sh \
            release/patch-android-flclash.py \
            --title "Remnant VPN Android — Technical Preview — Build ${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --notes-file release/NOTES.md \
            --prerelease
